<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Redbrick dashboards for service status and Grafana."
    />
    <meta name="theme-color" content="#a71e22" />
    <meta property="og:title" content="Redbrick Dashboards" />
    <meta
      property="og:description"
      content="Redbrick service status and Grafana dashboards."
    />
    <meta
      property="og:image"
      content="https://redbrick.dcu.ie/assets/favicon.ico"
    />
    <meta property="og:url" content="https://status.redbrick.dcu.ie" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="https://redbrick.dcu.ie/assets/favicon.ico"
      type="image/x-icon"
    />
    <title>Redbrick Dashboards</title>
    <style>
      :root {
        --bg: #0b0f15;
        --panel: #131a24;
        --text: #e5eaf3;
        --muted: #99a3b5;
        --active: #a71e22;
        --border: #2a3342;
        --active-hover: #ab3232;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .app {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }

      .tab {
        appearance: none;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: 120ms ease;
      }

      .tab:hover {
        color: var(--text);
        border-color: #3b4659;
      }

      .tab.active {
        background: var(--active);
        color: #fff;
        border-color: var(--active);
      }

      .frame-wrap {
        flex: 1;
        min-height: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #fff;
      }

      #warning-popup {
        transition: box-shadow 0.2s ease;
        position: fixed;
        top: 10px;
        right: 10px;
        background-color: var(--active);
        color: #fff;
        padding: 10px;
        border-radius: 5px;
      }

      #warning-popup a {
        color: #fff;
      }

      #warning-popup:hover {
        z-index: 1000;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0);
        background-color: var(--active-hover);
      }
    </style>
  </head>

  <body>
    <div class="app">
      <nav class="tabs" aria-label="Dashboard Tabs">
        <button
          class="tab active"
          data-src="https://gatus.redbrick.dcu.ie"
          type="button"
        >
          Status
        </button>
        <button
          class="tab"
          data-src="https://grafana.redbrick.dcu.ie/public-dashboards/987d66f2bf304c99afed7efa10f185ed"
          type="button"
        >
          Servers
        </button>
      </nav>

      <main class="frame-wrap">
        <iframe
          id="dashboard-frame"
          title="Redbrick Dashboard"
          src="https://gatus.redbrick.dcu.ie"
          loading="eager"
          referrerpolicy="no-referrer"
        ></iframe>
      </main>
    </div>

    <script>
      const tabs = document.querySelectorAll(".tab");
      const frame = document.getElementById("dashboard-frame");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          const nextSrc = tab.dataset.src;
          if (!nextSrc) {
            return;
          }

          if (tab.dataset.external === "true") {
            window.open(nextSrc, "_blank", "noopener,noreferrer");
            return;
          }

          if (frame.src === nextSrc) {
            return;
          }

          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          frame.src = nextSrc;
        });
      });

      const tabsToCheck = document.getElementsByClassName("tab");
      for (const tab of tabsToCheck) {
        const url = tab.dataset.src;
      
        fetch(url, { method: "HEAD", mode: "no-cors" })
          .then((response) => {
            // response.status will be 0, and response.ok will be false. with no-cors, we can only assume it worked if it reached this .then() block.
            console.log(`Successfully reached the server at ${url} (Opaque response)`);
          })
          .catch((error) => {
            // This will now ONLY trigger if the domain is completely down, blocked, or invalid.
            console.error(`Error fetching dashboard at ${url}:`, error);

            if (document.getElementById("warning-popup")) {
              return; 
            }
            const warningPopup = document.createElement("div");
            warningPopup.id = "warning-popup";
            warningPopup.innerHTML = `Warning: A Dashboard is not reachable. Please
      check the <a href="https://dcu.ie">Redbrick Discord</a> for updates.`;
            document.body.appendChild(warningPopup);

            warningPopup.addEventListener("click", (e) => {
              if (e.target.tagName === "A") {
                return;
              }
              warningPopup.remove();
            });
          });
      }

    </script>
  </body>
</html>
